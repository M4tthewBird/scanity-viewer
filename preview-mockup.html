<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Scanity Viewer — visual preview (mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #101112;
    --ink-soft: #25272a;
    --white: #ffffff;
    --cloud: #f5f6f7;
    --muted: #6e7479;
    --blue: #246bfd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    overflow: hidden;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(145deg, #dfe4e7, #f9fafb);
    color: var(--ink);
  }

  /* Fake "splat scene" backdrop, standing in for the real WebGL canvas —
     matches .demo-viewer-frame's own idle-state background on scanity.cz */
  #fakeCanvas {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 28% 30%, rgba(36,107,253,0.10), transparent 45%),
      radial-gradient(circle at 72% 65%, rgba(16,17,18,0.05), transparent 50%),
      linear-gradient(145deg, #dfe4e7, #f9fafb);
  }
  #fakeCanvas::after {
    content: 'your Gaussian splat scene renders here';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(16,17,18,0.22);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  #ui { position: fixed; inset: 0; }

  /* Brand logo — real mark + wordmark, mirrors .brand in the site header */
  #brandLogo {
    position: absolute;
    top: 16px; left: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px 9px 12px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.9);
    background-color: rgba(255,255,255,0.72);
    box-shadow: 0 8px 30px rgba(16,17,18,0.07);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    text-decoration: none;
    color: var(--ink);
  }
  #brandLogo svg { display: block; height: 19px; width: auto; }
  #brandLogo span { font-size: 1rem; font-weight: 400; letter-spacing: 0.035em; }

  /* Loading panel */
  #loadingWrap {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    width: min(320px, calc(100vw - 32px));
    padding: 16px 20px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.9);
    background-color: rgba(255,255,255,0.72);
    box-shadow: 0 20px 50px rgba(16,17,18,0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  #loadingText { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; text-align: center; }
  #loadingBar {
    width: 100%; height: 6px; margin-top: 10px; border-radius: 3px; overflow: hidden;
    background-color: rgba(16,17,18,0.08);
  }
  #loadingBarFill {
    height: 100%; width: 63%;
    background: var(--blue);
  }

  /* Controls row */
  #controlsWrap {
    position: absolute;
    left: 16px; right: 16px; bottom: 16px;
    display: flex; justify-content: center;
  }
  #buttonsContainer { display: flex; gap: 8px; }
  .buttonGroup {
    display: flex;
    background-color: rgba(255,255,255,0.72);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 100px;
    box-shadow: 0 8px 30px rgba(16,17,18,0.07);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    overflow: hidden;
  }
  .controlButton {
    width: 34px; height: 34px; border: 0; cursor: pointer;
    color: var(--muted);
    background-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .controlButton svg { width: 18px; height: 18px; fill: currentColor; }
  /* camera-mode toggle: persistent "active" state = ink fill (matches
     button-dark / viewer-switch-btn.is-active on the main site) */
  .toggle.active { background: var(--ink); color: #fff; }
  .toggle.left { border-radius: 100px 0 0 100px; }
  .toggle.right { border-radius: 0 100px 100px 0; }

  /* Settings panel, shown open for illustration */
  #settingsPanel {
    position: fixed;
    right: 16px;
    bottom: 86px;
    padding: 12px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.9);
    display: flex; flex-direction: column; gap: 4px;
    font-size: 13px;
    color: var(--muted);
    background-color: rgba(255,255,255,0.85);
    box-shadow: 0 20px 50px rgba(16,17,18,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    width: 210px;
  }
  .settingsRow { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; font-weight: 600; }
  .toggleTrack {
    width: 36px; height: 20px; border-radius: 10px;
    background-color: var(--blue);
    position: relative;
  }
  .toggleThumb {
    width: 16px; height: 16px; border-radius: 50%;
    background-color: #fff;
    box-shadow: 0 1px 4px rgba(16,17,18,0.3);
    position: absolute; top: 2px; left: 18px;
  }

  #caption {
    position: fixed; top: 16px; right: 16px;
    max-width: 300px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--muted);
    background: rgba(255,255,255,0.85);
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 20px 50px rgba(16,17,18,0.1);
    backdrop-filter: blur(18px);
  }
</style>
</head>
<body>
  <div id="fakeCanvas"></div>
  <div id="ui">
    <a id="brandLogo" href="#">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 31.28 54.07" role="img" aria-label="Scanity">
        <path fill="currentColor" d="M30.43,6.03L12.82,15.83l-1.92,1.07v16.69l-2.21,1.1L.48,29.97l-.09-.05-.1-.05c-.2-.1-.26-.2-.29-.35V12.56c.12-.87.44-1.33.66-1.56L20.03.08l.03-.02.03-.02s.08-.03.09-.04c.01,0,.02,0,.05.03l.16.1,10.04,5.9Z"/>
        <path fill="currentColor" d="M.85,48.04l17.61-9.8,1.92-1.07v-16.69s2.21-1.1,2.21-1.1l8.21,4.72.09.05.1.05c.2.1.26.2.29.35v16.96c-.12.87-.44,1.33-.66,1.56l-19.37,10.92-.03.02-.03.02s-.08.03-.09.04c-.01,0-.02,0-.05-.03l-.16-.1L.85,48.04Z"/>
      </svg>
      <span>Scanity</span>
    </a>

    <div id="loadingWrap">
      <div id="loadingText">Loading scene… 63%</div>
      <div id="loadingBar"><div id="loadingBarFill"></div></div>
    </div>

    <div id="settingsPanel">
      <div class="settingsRow"><span>Performance Mode</span><div class="toggleTrack"><div class="toggleThumb"></div></div></div>
      <div class="settingsRow"><span>Show Annotations</span><div class="toggleTrack"><div class="toggleThumb"></div></div></div>
    </div>

    <div id="controlsWrap">
      <div id="buttonsContainer">
        <div class="buttonGroup">
          <button class="controlButton toggle left active">
            <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button class="controlButton toggle right">
            <svg viewBox="0 0 20 20"><path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
          </button>
        </div>
        <div class="buttonGroup">
          <button class="controlButton">
            <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 9v5M10 6.5v.5" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button class="controlButton">
            <svg viewBox="0 0 20 20"><circle cx="10" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 8a6 6 0 0112 0" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
          </button>
          <button class="controlButton">
            <svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="caption">
      Static mockup using your real logo, colors (Deep Ink / Scan Blue), Manrope, and pill/glass shapes pulled from index.css + DESIGN.md — not the compiled functional viewer.
    </div>
  </div>
</body>
</html>
